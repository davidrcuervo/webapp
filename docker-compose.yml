name: ${WEBAPP_NAME}

services:

  postgres:
    image: ${WEBAPP_NAME}/postgres:18.6
    restart: always
    user: postgres
    working_dir: /opt/mypostgres
    entrypoint: scripts/postgres-entrypoint.sh
    secrets:
      - jasypt-password
#    volumes:
#      - ./docker/scripts/database/postgres-entrypoint.sh:/opt/mypostgres/scripts/postgres-entrypoint.sh
#      - ./docker/scripts/database/postgres-exitpoint.sh:/opt/mypostgres/scripts/postgres-exitpoint.sh
#      - /var/data/docker/postgres/logs:/opt/mypostgres/logs
#      - /var/data/docker/db/postgresql:/opt/mypostgres/data
    environment:
      - HOME=/opt/mypostgres
    env_file:
      - .env
    networks:
      - backend
    ports:
      - "5432:5432"
#    pre_stop:
#      - command: /opt/mypostgres/scripts/postgres-exitpoint.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    build:
      target: postgreset
      args:
        - ARCHITECTURE=${ARCHITECTURE}
        - JAVA_VERSION=${JAVA_VERSION}

  keycloak:
    image: etienda/keycloak:26.8.2
    user: keycloak
    working_dir: /opt/keycloak
    entrypoint: /opt/keycloak/kc.entrypoint.sh
    secrets:
      - jasypt-password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
#    ports:
#      - "9001:9001"
#      - "8001:8001"
#      - "8443:8443"
    env_file:
      - .env
    healthcheck:
      test: ["CMD","curl","--fail","--insecure","https://keycloaket:9001/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    build:
      target: keycloaket
      args:
        - ARCHITECTURE=${ARCHITECTURE}
        - JAVA_VERSION=${JAVA_VERSION}
#    volumes:
#      - ./docker/scripts/keycloak/kc.entrypoint.sh:/opt/keycloak/kc.entrypoint.sh

  keycloakcnf:
    image: etienda/keycloakcnf:26.8.2
    user: keycloak
    working_dir: /opt/keycloak
    entrypoint: /opt/keycloak/kc.config.sh
    env_file:
      - .env
    secrets:
      - jasypt-password
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: [ "CMD","sh","-c","./kc.check.sh" ]
      interval: 20s
      timeout: 25s
      retries: 5
      start_period: 40s
    build:
      target: keycloaketcnf
    volumes:
      - ./docker/scripts/keycloak/kc.config.sh:/opt/keycloak/kc.config.sh
#      - ./docker/scripts/keycloak/kc.check.sh:/opt/keycloak/kc.check.sh

  nginx:
    image: etienda/nginx:1.28
#    user: nginx
    working_dir: /opt/nginx
    entrypoint: ./nginx.entrypoint.sh
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - ${KC_PUBLIC_ADDRESS}
          - ${WEBAPP_PUBLIC_ADDRESS}
    ports:
      - "80:80"
      - "${WEBAPP_PUBLIC_PORT}:${WEBAPP_PUBLIC_PORT}"
    healthcheck:
      test: ["CMD","curl","--fail","--insecure","https://${KC_PUBLIC_ADDRESS}:${WEBAPP_PUBLIC_PORT}/nginx/health"]
    build:
      target: etnginx
      args:
        - ARCHITECTURE=${ARCHITECTURE}
        - JAVA_VERSION=${JAVA_VERSION}
    volumes:
      - ./docker/scripts/nginx:/opt/nginx

  java:
    image: etienda/java:1.0
    secrets:
      - jasypt-password
    networks:
      - backend
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    build:
      target: etjava
      args:
        - ARCHITECTURE=${ARCHITECTURE}
        - JAVA_VERSION=${JAVA_VERSION}
#    volumes:
#      - ./docker/scripts/jasypt/jdecrypt.sh:/opt/jasypt/jdecrypt.sh

  user:
    image: etienda/user:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: ["./bin/safestart.sh"]
    command:
      - userKc
      - ${PORT_USUARIO}
    secrets:
      - jasypt-password
    depends_on:
      keycloakcnf:
          condition: service_healthy
    networks:
      - backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    healthcheck:
      test: [ "CMD","curl","--fail","http://etuser:8081/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 2m
    build:
      target: etuser
    volumes:
      - ./application.yml:/opt/webapp/etc/application.yml
#      - ./docker/scripts/webapp:/opt/webapp/bin

  schema:
    image: etienda/schema:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: [ "./bin/safestart.sh" ]
    command:
      - schema
      - ${PORT_SCHEMA}
    secrets:
      - jasypt-password
    depends_on:
      user:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    healthcheck:
      test: [ "CMD","curl","--fail","http://etschema:8083/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 2m
    build:
      target: etschema
    volumes:
      - ./application.yml:/opt/webapp/etc/application.yml
#      - ./docker/scripts/webapp:/opt/webapp/bin

  messenger:
    image: etienda/mail:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: [ "./bin/safestart.sh" ]
    command:
      - messenger
      - ${PORT_MESSENGER}
    secrets:
      - jasypt-password
    depends_on:
      user:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    healthcheck:
      test: [ "CMD","curl","--fail","http://etmail:8082/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 2m
    build:
      target: etmail
    volumes:
      - ./application.yml:/opt/webapp/etc/application.yml

  company:
    image: etienda/company:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: [ "./bin/safestart.sh" ]
    command:
      - company
      - ${PORT_COMPANY}
    secrets:
      - jasypt-password
    depends_on:
      user:
        condition: service_healthy
      schema:
        condition: service_healthy
      messenger:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    healthcheck:
      test: [ "CMD","curl","--fail","http://etcompany:8084/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 2m
    build:
      target: etcompany
    volumes:
      - ./application.yml:/opt/webapp/etc/application.yml

  frontend:
    image: etienda/frontend:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: ["./bin/safestart.sh"]
    command:
      - frontend
      - ${PORT_FRONTEND}
    secrets:
      - jasypt-password
    depends_on:
      user:
        condition: service_healthy
      schema:
        condition: service_healthy
      messenger:
        condition: service_healthy
    networks:
      - backend
#    ports:
#      - "8080:8080"
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    healthcheck:
      test: [ "CMD","curl","--fail","http://frontend:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 2m
    build:
      target: frontend
#    volumes:
#      - ./frontend:/opt/webapp/src/frontend

  testing:
    image: ${WEBAPP_NAME}/test:1.0
    user: webappuser
    working_dir: /opt/webapp
    entrypoint: /bin/bash
    secrets:
      - jasypt-password
    depends_on:
      - postgres
      - keycloak
    networks:
      - backend
    env_file:
      - .env
    environment:
      - HOME=/opt/webapp
    volumes:
      - ./docker/scripts/webapp:/opt/webapp/bin
      - ./API:/opt/webapp/API
      - ./application.yml:/opt/webapp/etc/application.yml
    build:
      target: testcontainer

  claude:
    image: ${WEBAPP_NAME}/claude:2.1.330
    entrypoint: ["/home/claude/.local/bin/claude"]
#    command: ["--permission-mode", "plan"]
    working_dir: /home/claude/${WEBAPP_NAME}
    env_file:
      - .env
      - ./docker/private/claude.env
    environment:
      CLAUDE_CONFIG_DIR: /home/claude/.claude
    build:
      target: claude
      args:
        - ARCHITECTURE=${ARCHITECTURE}
        - JAVA_VERSION=${JAVA_VERSION}
    networks:
      - backend
    volumes:
      - ./.claude_config:/home/claude/.claude
      - ./:/home/claude/${WEBAPP_NAME}

networks:
  backend:

secrets:
  jasypt-password:
    file: docker/private/jasypt-password.txt
